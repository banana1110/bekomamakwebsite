<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Beko Bayi | Yönetim Paneli</title>
<style>
:root{--blue:#0876d1;--ink:#142033;--bg:#f5f7fa;--line:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif;}
body{background:var(--bg);color:var(--ink);padding:40px 20px;}
.container{max-width:1000px;width:100%;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
h1{margin-bottom:20px;font-size:24px;color:var(--blue)}
.form-group{margin-bottom:15px}
label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;}
input,select,textarea{width:100%;height:45px;padding:0 15px;border:2px solid var(--line);border-radius:10px;outline:none;font-size:14px;}
textarea{height:90px;padding:10px 15px;resize:vertical;}
button{height:45px;padding:0 20px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
button:hover{background:#065fa8;}
.cancel-btn{background:#69778b;margin-left:10px;display:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #e5eaf0;text-align:left;font-size:14px}
th{background:#f8fafc}
.del-btn{background:#e53935;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}
.edit-btn{background:#f59e0b;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-right:5px}
#loginScreen{max-width:420px;margin:100px auto;background:#fff;padding:40px 30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#adminPanel{display:none}
.section-title{margin-top:40px;font-size:20px;border-bottom:2px solid #e5eaf0;padding-bottom:10px;color:var(--ink);}

#imgPreviewContainer {display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;}
.preview-box {position:relative; width:90px; height:90px; border:1px solid var(--line); border-radius:10px; padding:5px; background:#fff;}
.preview-box img {width:100%; height:100%; object-fit:contain;}
.preview-box .remove-btn {position:absolute; top:-8px; right:-8px; background:#e53935; color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:11px; padding:0; line-height:22px; text-align:center;}
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="loginScreen">
    <h2>Bayi Girişi</h2>
    <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Yönetim paneli için bilgilerinizi girin.</p>
    <div class="form-group">
        <label>Veritabanı Kullanıcı Adı</label>
        <input type="text" id="adminEmail" placeholder="admin" value="admin">
    </div>
    <div class="form-group">
        <label>Veritabanı Şifresi</label>
        <input type="password" id="adminPass" placeholder="Şifre">
    </div>
    <button onclick="checkLogin()" style="width:100%">Giriş Yap</button>
</div>

<div id="adminPanel" class="container">
    <h1 id="panelTitle">Beko Bayi - Yönetim Paneli</h1>
    <div style="margin-bottom:20px;"><a href="/" target="_blank" style="color:var(--blue); font-weight:bold;">→ Mağaza Sitesini Görüntüle</a></div>
    
    <h2 class="section-title">Yeni Ürün Ekle / Düzenle</h2>
    <form id="productForm" onsubmit="handleFormSubmit(event)" style="margin-top:20px;">
        <input type="hidden" id="editId">
        <div class="form-group">
            <label>Ürün Adı</label>
            <input type="text" id="title" required placeholder="Örn: BEKO 9 KG ÇAMAŞIR MAKİNESİ">
        </div>
        <div class="form-group">
            <label>Fiyat (TL)</label>
            <input type="number" id="price" required placeholder="18500">
        </div>
        <div class="form-group">
            <label>Kategori</label>
            <select id="category" onchange="updateSubCategories(this.value)">
                <option value="Beyaz Eşya">Beyaz Eşya</option>
                <option value="Ankastre">Ankastre</option>
                <option value="Televizyon">Televizyon</option>
                <option value="Elektronik">Elektronik</option>
                <option value="Isıtma Soğutma ve Enerji">Isıtma Soğutma ve Enerji</option>
                <option value="Küçük Ev Aletleri">Küçük Ev Aletleri</option>
                <option value="Yedek Parça Ve Aksesuar">Yedek Parça Ve Aksesuar</option>
                <option value="Su Sebili & Su Arıtma">Su Sebili & Su Arıtma</option>
                <option value="Temizlik Ve Bakım Ürünleri">Temizlik Ve Bakım Ürünleri</option>
                <option value="Enerji Çözümleri">Enerji Çözümleri</option>
                <option value="Evcil Hayvan Ürünleri">Evcil Hayvan Ürünleri</option>
                <option value="UmutKent Koleksiyonu">UmutKent Koleksiyonu</option>
                <option value="İz Bırak">İz Bırak</option>
                <option value="Spor ve Outdoor">Spor ve Outdoor</option>
                <option value="Anne ve Bebek Ürünleri">Anne ve Bebek Ürünleri</option>
            </select>
        </div>
        <div class="form-group">
            <label>Alt Kategori (Opsiyonel)</label>
            <select id="subCategory">
                <option value="">Alt Kategori Seçiniz (Opsiyonel)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Stok Durumu</label>
            <select id="stock">
                <option value="Stokta Var">Stokta Var</option>
                <option value="Son 3 Ürün">Son 3 Ürün</option>
                <option value="Tükendi">Tükendi</option>
                <option value="Sipariş Üzerine">Sipariş Üzerine</option>
            </select>
        </div>
        <div class="form-group">
            <label>Garanti Süresi</label>
            <input type="text" id="warranty" placeholder="Örn: 3 Yıl Beko Garanti (veya 10 Yıl Motor Garantisi)" value="3 Yıl Beko Garanti">
        </div>
        <div class="form-group">
            <label>Ürün Açıklaması</label>
            <textarea id="description" placeholder="Ürün özellikleri, enerji sınıfı veya detaylı açıklamayı buraya girin..."></textarea>
        </div>
        <div class="form-group">
            <label>Ürün Görselleri (Çoklu Seçim Yapabilirsiniz)</label>
            <input type="file" id="imgFile" accept="image/*" multiple onchange="handleMultipleImagesSelect(this)" style="height:auto;padding:10px 15px">
            <div id="imgStatus" style="font-size:12px;color:#64748b;margin-top:6px"></div>
            <div id="imgPreviewContainer"></div>
        </div>
        
        <button type="submit" id="submitBtn">Ürünü Ekle / Kaydet</button>
        <button type="button" id="cancelBtn" class="cancel-btn" onclick="resetForm()">İptal</button>
    </form>

    <h2 class="section-title">Gelen Siparişler</h2>
    <table>
        <thead>
            <tr>
                <th>Müşteri Adı</th>
                <th>Telefon & Adres</th>
                <th>Ürünler</th>
                <th>Toplam Tutar</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
    </table>

    <h2 class="section-title">Mevcut Ürünler</h2>
    <table>
        <thead>
            <tr>
                <th>Ürün Adı</th>
                <th>Kategori</th>
                <th>Fiyat</th>
                <th>Stok</th>
                <th>Garanti</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
    </table>
</div>

<script>
let allProducts = [];
let uploading = false;
let uploadedImages = [];

const categorySubMap = {
  "Beyaz Eşya": ["Buzdolabı", "Derin Dondurucu", "Çamaşır Makinesi", "Bulaşık Makinesi", "Kurutma Makinesi", "Kurutmalı Çamaşır Makinesi", "Fırın", "Mikrodalga Fırın", "Set Üstü Ocak", "İçecek Soğutucu", "Beyaz Eşya Yedek Parça ve Aksesuar", "Çeyiz Set"],
  "Ankastre": ["Ankastre Ocak", "Ankastre Davlumbazlar", "Ankastre Aspiratörler", "Ankastre Bulaşık Makineleri", "Ankastre Buzdolabı", "Ankastre Fırın", "Ankastre Mikrodalgalar", "Ankastre Set", "Pişirici Yedek Parça ve Aksesuarları"],
  "Televizyon": ["OLED TV", "QLED", "Yapay Zeka TV", "Oyun TV", "Dev Ekran TV", "Smart TV", "Google TV", "Full HD& HD TV", "4K TV", "LED TV", "Mutfak Televizyonu", "Hotel Tv", "Grundig TV", "Philips TV", "TCL TV"],
  "Elektronik": ["Bilgisayar", "Hobi - Oyun (Gaming) Ürünleri", "Ses& Görüntü Sistemleri", "Ödeme Sistemleri", "Cep Telefonu", "Cep Telefonu Aksesuarları", "Giyilebilir Teknoloji"],
  "Küçük Ev Aletleri": ["Kahve Makinesi", "Dondurma Makinesi", "Pişirici", "Outdoor Ekipman", "Kişisel Bakım", "Elektrikli Süpürge", "Ütü", "Karıştırıcı& Doğrayıcı", "UV Temizleme Cihazı", "Yoğurt &Kefir Makinesi", "Kettle", "Katı Meyve Sıkacağı", "Narenciye Sıkacağı", "Çay Makinesi", "Semaver", "Buz Makinesi", "Küçük Ev Aletleri Yedek Parça ve Aksesuarları", "Küçük Ev Aletleri Seti", "Ev Temizlik Ekipmanları ve Teknolojileri", "Güzellik ve Bakım", "Kahve ve Sofra Ürünleri", "Frozen ve Slush Makinesi"],
  "Yedek Parça Ve Aksesuar": ["Aksesuarlar", "Isıtma Soğutma Yedek Parça ve Aksesuarları", "Beyaz Eşya Yedek Parça ve Aksesuarları", "Televizyon Aksesuarları", "Küçük Ev Aletleri Yedek Parça ve Aksesuarları"],
  "Isıtma Soğutma ve Enerji": ["Klima", "Hava Temizleyici", "Hava Soğutucu", "Vantilatör", "Elektrikli Isıtıcı", "Termosifon", "Kombi", "Nem Alma Cihazı", "Isıtma Soğutma Yedek Parça ve Aksesuarları"],
  "Su Sebili & Su Arıtma": ["Su Arıtma Cihazı", "Su Sebili"],
  "Temizlik Ve Bakım Ürünleri": ["Diğer Temizlik Ürünleri", "Kurutma Makinesi Temizlik ve Bakım Ürünleri", "Davlumbaz & Aspiratör Temizlik ve Bakım Ürünleri", "Klima Temizlik ve Bakım Ürünleri", "TV & Bilgisayar Temizlik ve Bakım Ürünleri", "Küçük Ev Aleti Temizlik ve Bakım Ürünleri", "Buzdolabı Temizlik ve Bakım Ürünleri", "Ocak ve Fırın Temizlik ve Bakım Ürünleri", "Çamaşır Makinesi Temizlik ve Bakım Ürünleri", "Bulaşık Makinesi Temizlik ve Bakım Ürünleri", "Temizlik ve Bakım Ürünleri Set"],
  "Enerji Çözümleri": ["Güneş Paneli", "Inverter", "Sun Junior (Enerji Depolama Sistemi)", "Güç Kaynağı UPS", "Taşınabilir Güneş Paneli", "Isı Pompası", "Elektrikli Araç Şarj İstasyonu"],
  "Spor ve Outdoor": ["Elektrikli Scooter", "Kamp ve Outdoor Ekipmanları", "Elektrikli Bisiklet", "Araç Buzdolabı", "Deniz & Su Sporları Ekipmanları"]
};

function updateSubCategories(selectedCategory) {
    const subSelect = document.getElementById('subCategory');
    subSelect.innerHTML = '<option value="">Alt Kategori Seçiniz (Opsiyonel)</option>';

    if (categorySubMap[selectedCategory]) {
        categorySubMap[selectedCategory].forEach(sub => {
            subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
        });
    }
}

function resizeImage(file, maxSize = 900) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const image = new Image();
            image.onerror = reject;
            image.onload = () => {
                const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(image.width * scale);
                canvas.height = Math.round(image.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            image.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

async function handleMultipleImagesSelect(input) {
    const files = Array.from(input.files);
    if (files.length === 0) return;
    
    const status = document.getElementById('imgStatus');
    uploading = true;
    status.style.color = '#0876d1';
    
    for (let i = 0; i < files.length; i++) {
        status.innerText = `${i + 1} / ${files.length} resim yükleniyor. Lütfen bekleyin...`;
        try {
            const dataUrl = await resizeImage(files[i]);
            const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: dataUrl })
            });
            const result = await res.json();
            if (!res.ok || !result.url) throw new Error(result.error);
            
            uploadedImages.push(result.url);
            renderPreviews();
        } catch (err) {
            alert(`${files[i].name} yüklenemedi: ` + err.message);
        }
    }
    
    status.style.color = 'green';
    status.innerText = 'Tüm resimler başarıyla yüklendi.';
    input.value = '';
    uploading = false;
}

function renderPreviews() {
    const container = document.getElementById('imgPreviewContainer');
    container.innerHTML = '';
    uploadedImages.forEach((url, index) => {
        container.innerHTML += `
        <div class="preview-box">
            <img src="${url}">
            <button type="button" class="remove-btn" onclick="removeImage(${index})">X</button>
        </div>`;
    });
}

function removeImage(index) {
    uploadedImages.splice(index, 1);
    renderPreviews();
}

const socket = io();
socket.on('newOrder', function(order) {
    loadOrders(); 
});

async function checkLogin() {
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPass').value;
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if(data.success) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            updateSubCategories(document.getElementById('category').value);
            loadProducts();
            loadOrders();
        } else {
            alert(data.error || 'Giriş başarısız!');
        }
    } catch(err) {
        alert('Sunucu bağlantı hatası!');
    }
}

async function loadProducts() {
    const res = await fetch('/api/products');
    const products = await res.json();
    allProducts = products;
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = '';
    
    products.forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td><b>${p.title}</b></td>
                <td>
                    ${p.category}
                    ${p.subCategory ? `<br><small style="color:var(--blue); font-weight:bold;">↳ ${p.subCategory}</small>` : ''}
                </td>
                <td>${Number(p.price).toLocaleString('tr-TR')} TL</td>
                <td><span style="color:${p.stock === 'Tükendi' ? 'red' : 'green'}">${p.stock || 'Stokta Var'}</span></td>
                <td>${p.warranty || '3 Yıl Beko Garanti'}</td>
                <td>
                    <button class="edit-btn" onclick="startEdit('${p._id}')">Düzenle</button>
                    <button class="del-btn" onclick="deleteProduct('${p._id}')">Sil</button>
                </td>
            </tr>
        `;
    });
}

async function loadOrders() {
    const res = await fetch('/api/orders');
    const orders = await res.json();
    const tbody = document.getElementById('orderTableBody');
    tbody.innerHTML = '';

    if(orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">Henüz gelen sipariş yok.</td></tr>`;
        return;
    }

    orders.forEach(o => {
        let productList = o.products.map(item => {
            const qty = item.qty || 1;
            const itemTotal = Number(item.price * qty).toLocaleString('tr-TR');
            return `• <b>${qty} Adet</b> - ${item.title} <small style="color:#64748b;">(${itemTotal} TL)</small>`;
        }).join('<br>');

        tbody.innerHTML += `
            <tr>
                <td><b>${o.customerName}</b></td>
                <td>${o.phone}<br><small>${o.address}</small></td>
                <td>${productList}</td>
                <td><b>${Number(o.totalPrice).toLocaleString('tr-TR')} TL</b></td>
                <td>
                    <button class="del-btn" onclick="deleteOrder('${o._id}')">Siparişi Sil</button>
                </td>
            </tr>
        `;
    });
}

async function deleteOrder(id) {
    if(!confirm('Bu siparişi silmek istediğinize emin misiniz?')) return;
    const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
    if(res.ok) loadOrders();
}

function handleFormSubmit(e) {
    e.preventDefault();
    if (uploading) { alert('Resimler yükleniyor, lütfen tamamlanmasını bekleyin.'); return; }
    const editId = document.getElementById('editId').value;
    if(editId) updateProduct(editId);
    else addProduct();
}

async function addProduct() {
    if (uploadedImages.length === 0) {
        alert('Lütfen en az bir adet ürün görseli yükleyin!');
        return;
    }

    const data = {
        title: document.getElementById('title').value.trim(),
        price: Number(document.getElementById('price').value),
        category: document.getElementById('category').value,
        subCategory: document.getElementById('subCategory').value,
        stock: document.getElementById('stock').value,
        warranty: document.getElementById('warranty').value.trim(),
        description: document.getElementById('description').value.trim(),
        img: uploadedImages[0], // MongoDB şeması için ana görsel zorunludur
        images: uploadedImages
    };

    try {
        const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            resetForm();
            loadProducts();
            alert('Ürün başarıyla eklendi!');
        } else {
            const errData = await res.json();
            alert('Hata: ' + (errData.error || 'Ürün eklenemedi.'));
        }
    } catch (err) {
        alert('Sunucu bağlantı hatası: ' + err.message);
    }
}

function startEdit(id) {
    const p = allProducts.find(item => item._id === id);
    if(!p) return;
    document.getElementById('editId').value = p._id;
    document.getElementById('title').value = p.title;
    document.getElementById('price').value = p.price;
    document.getElementById('category').value = p.category;
    
    // Önce seçilen ana kategorinin alt kategorilerini yükle, sonra kayıtlı olanı seç
    updateSubCategories(p.category);
    document.getElementById('subCategory').value = p.subCategory || '';
    
    document.getElementById('stock').value = p.stock || 'Stokta Var';
    document.getElementById('warranty').value = p.warranty || '3 Yıl Beko Garanti';
    document.getElementById('description').value = p.description || '';
    
    uploadedImages = p.images && p.images.length > 0 ? [...p.images] : (p.img ? [p.img] : []);
    renderPreviews();
    
    document.getElementById('imgFile').value = '';
    document.getElementById('imgStatus').innerText = 'Mevcut resimler listeleniyor. Yeni ekleme veya silme yapabilirsiniz.';
    document.getElementById('submitBtn').innerText = 'Değişiklikleri Kaydet (Güncelle)';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    window.scrollTo({top: 0, behavior: 'smooth'});
}

async function updateProduct(id) {
    const data = {
        title: document.getElementById('title').value.trim(),
        price: Number(document.getElementById('price').value),
        category: document.getElementById('category').value,
        subCategory: document.getElementById('subCategory').value,
        stock: document.getElementById('stock').value,
        warranty: document.getElementById('warranty').value.trim(),
        description: document.getElementById('description').value.trim(),
        img: uploadedImages.length > 0 ? uploadedImages[0] : undefined,
        images: uploadedImages
    };

    try {
        const res = await fetch(`/api/products/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            resetForm();
            loadProducts();
            alert('Ürün başarıyla güncellendi!');
        } else {
            const errData = await res.json();
            alert('Hata: ' + (errData.error || 'Ürün güncellenemedi.'));
        }
    } catch (err) {
        alert('Sunucu bağlantı hatası: ' + err.message);
    }
}

function resetForm() {
    document.getElementById('productForm').reset();
    updateSubCategories(document.getElementById('category').value);
    document.getElementById('warranty').value = '3 Yıl Beko Garanti';
    document.getElementById('description').value = '';
    uploadedImages = [];
    renderPreviews();
    document.getElementById('imgStatus').innerText = '';
    document.getElementById('editId').value = '';
    document.getElementById('submitBtn').innerText = 'Ürünü Ekle / Kaydet';
    document.getElementById('cancelBtn').style.display = 'none';
}

async function deleteProduct(id) {
    if(!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
    const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
    if(res.ok) loadProducts();
}
</script>
</body>
</html>
